name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

      # 供應鏈稽核閘門（Ark 前端規範 §5.23.0）。
      #
      # 由來是一個不對稱：後端每個專案的 CI 都有 pip-audit，前端從來沒有對應
      # 要求。而前端最近兩個最大的安全發現（dompurify XSS、react-router 未認證
      # RCE）都出自少數碰巧有在跑的專案，不是被規範抓到的。
      #
      # --prod 是刻意的：devDependencies 的弱點不會進到使用者手上。
      - run: pnpm audit --prod

      # 公開範本也要驗證自己的 frontend compliance。固定 scanner 版本、
      # 不依賴 main；scanner 的 exit code 是失敗項目數，99 代表檢查未執行。
      #
      # 釘 commit SHA 而不是 branch 名（2026-09-07 修）：
      # 原本釘的是 `--branch scanner-2026-08-25`。那個 branch 2026-08-25 當天確實
      # 存在、掃描也跑完了（28 通過 / 5 警告），但**之後在上游被刪掉**，於是
      # `fatal: Remote branch scanner-2026-08-25 not found in upstream origin`
      # ——本 repo 的 CI 從那天起一路紅了 13 天沒有人發現，也就是說這個範本
      # 自 8/25 起就沒有真的被合規掃描過。
      #
      # branch 名字是可以被移動與刪除的，拿它當「固定版本」名不副實。SHA 不會。
      # 0981d417 就是當初那個 branch 指向的同一份內容（commit message
      # 「scanner-2026-08-25：合規檢查器公開版」，腳本版本標記 2026-08-25a），
      # 目前是該 repo main 的 HEAD。
      #
      # 用 init + fetch <sha> 而非 clone：`git clone --branch` 只吃 ref 名，
      # 吃不了 SHA。GitHub 允許直接 fetch 可達的 SHA。
      - name: Ark frontend compliance
        run: |
          mkdir -p /tmp/ark-scanner && cd /tmp/ark-scanner
          git init --quiet .
          git fetch --depth 1 --quiet https://github.com/foson-co/arkite-frontend-scanner.git 0981d41763843770dd49b89e27b4d8fe0484fc4d
          git checkout --quiet FETCH_HEAD
          bash /tmp/ark-scanner/scripts/check-compliance.sh "$GITHUB_WORKSPACE"

      - run: pnpm build
